# /etc/nginx/conf.d/00-default-server.conf  —  OPTIONNEL (recommandé)
#
# Ferme les requêtes qui arrivent sur l'IP nue (212.132.85.245) ou sur un
# domaine tiers pointé vers le serveur. Sans ce bloc, le premier `server`
# chargé fait office de défaut : le site répondrait sur n'importe quel nom.
#
# PRÉREQUIS — sur AlmaLinux 9, /etc/nginx/nginx.conf contient déjà un bloc
#   server { listen 80 default_server; ... }
# Il faut le commenter, sinon `nginx -t` renvoie « duplicate default server ».
#
#   cp nginx-00-default-server.conf /etc/nginx/conf.d/
#   nginx -t && systemctl reload nginx
#
# À installer APRÈS que itekarwanda.org fonctionne — pas pendant la bascule.

server {
    listen      80  default_server;
    listen [::]:80  default_server;
    server_name _;
    return 444;
}

# Équivalent en HTTPS : coupe la poignée de main TLS sans présenter de
# certificat. Nécessite nginx >= 1.19.4 (AlmaLinux 9 fournit 1.20+).
server {
    listen      443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_reject_handshake on;
}
