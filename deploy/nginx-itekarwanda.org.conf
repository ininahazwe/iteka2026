# /etc/nginx/conf.d/itekarwanda.org.conf
# Production — Next.js servi par PM2 sur 127.0.0.1:3000
#
# ORDRE D'INSTALLATION (à respecter, sinon `nginx -t` échoue) :
#
#   1. DNS IONOS :  A  itekarwanda.org  -> 212.132.85.245
#                   A  www              -> 212.132.85.245
#                   A  2026             -> 212.132.85.245   (garder, pour la redirection)
#
#   2. SUPPRIMER l'ancienne conf, sinon conflit de server_name sur 2026 :
#        rm /etc/nginx/conf.d/2026.itekarwanda.org.conf
#
#   3. Installer d'abord le fichier « bootstrap » (HTTP seul) :
#        cp nginx-itekarwanda.org-bootstrap.conf /etc/nginx/conf.d/itekarwanda.org.conf
#        nginx -t && systemctl reload nginx
#      (les certificats n'existent pas encore : ce fichier-ci ne passerait pas)
#
#   4. mkdir -p /var/www/letsencrypt
#      certbot --nginx -d itekarwanda.org -d www.itekarwanda.org -d 2026.itekarwanda.org
#
#   5. Remplacer par CE fichier :
#        nginx -t && systemctl reload nginx

# --- HTTP : tout vers HTTPS (apex) -----------------------------------------
server {
    listen      80;
    listen [::]:80;
    server_name itekarwanda.org www.itekarwanda.org 2026.itekarwanda.org;

    # Renouvellements Let's Encrypt
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://itekarwanda.org$request_uri;
    }
}

# --- HTTPS : www + ancien sous-domaine de test -> apex ----------------------
server {
    listen      443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.itekarwanda.org 2026.itekarwanda.org;

    ssl_certificate     /etc/letsencrypt/live/itekarwanda.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/itekarwanda.org/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://itekarwanda.org$request_uri;
}

# --- HTTPS : le site --------------------------------------------------------
server {
    listen      443 ssl http2;
    listen [::]:443 ssl http2;
    server_name itekarwanda.org;

    ssl_certificate     /etc/letsencrypt/live/itekarwanda.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/itekarwanda.org/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Taille max des envois (formulaire de contact, pièces jointes)
    client_max_body_size 20M;

    # En-têtes de sécurité
    add_header X-Content-Type-Options "nosniff"                                 always;
    add_header X-Frame-Options        "SAMEORIGIN"                              always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin"         always;
    add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;

    # HSTS — à n'activer qu'APRÈS avoir vérifié que https://itekarwanda.org et
    # https://www.itekarwanda.org répondent correctement. Une fois envoyé, le
    # navigateur refusera le HTTP pendant toute la durée du max-age (1 an) :
    # décommenter seulement quand tout est validé.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Compression
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types      text/plain text/css text/xml application/json
                    application/javascript application/xml+rss
                    image/svg+xml application/rss+xml;

    # Assets Next.js : noms hashés au build, donc cachables indéfiniment
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Optimiseur d'images Next.js
    location /_next/image {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Application
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        'upgrade';
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
