# /etc/nginx/conf.d/itekarwanda.org.conf  —  ÉTAPE 1, TEMPORAIRE
#
# HTTP seul. Sert uniquement à permettre à certbot de valider les 3 noms de
# domaine (challenge HTTP-01) avant que les certificats n'existent.
#
#   rm /etc/nginx/conf.d/2026.itekarwanda.org.conf
#   cp nginx-itekarwanda.org-bootstrap.conf /etc/nginx/conf.d/itekarwanda.org.conf
#   nginx -t && systemctl reload nginx
#   mkdir -p /var/www/letsencrypt
#   certbot --nginx -d itekarwanda.org -d www.itekarwanda.org -d 2026.itekarwanda.org
#
# Puis remplacer par nginx-itekarwanda.org.conf (version finale).

server {
    listen      80;
    listen [::]:80;
    server_name itekarwanda.org www.itekarwanda.org 2026.itekarwanda.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        'upgrade';
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
