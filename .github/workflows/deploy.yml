name: Deploy frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

# Un seul déploiement à la fois (évite deux builds simultanés sur le VPS)
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  # Vérifie que le front compile AVANT de toucher au VPS : un build cassé
  # s'arrête ici et le site en ligne reste intact.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install, type-check and build
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
          npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://itekarwanda.org
          NEXT_PUBLIC_WP_URL: https://admin.itekarwanda.org
          NEXT_PUBLIC_WP_GRAPHQL_URL: https://admin.itekarwanda.org/graphql
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ci-placeholder

  deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            APP_DIR="/var/www/iteka2026"
            PM2_NAME="iteka-frontend"

            if [ ! -d "$APP_DIR" ]; then
              mkdir -p "$(dirname "$APP_DIR")"
              git clone https://github.com/ininahazwe/iteka2026.git "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch origin
            git checkout main
            git pull origin main

            cd frontend

            # Les variables NEXT_PUBLIC_* sont figées au build : sans elles, le site
            # serait déployé avec un bandeau d'erreur reCAPTCHA. On s'arrête avant.
            ENV_FILE=""
            for f in .env.production.local .env.local; do
              if [ -f "$f" ]; then ENV_FILE="$f"; break; fi
            done
            if [ -z "$ENV_FILE" ]; then
              echo "!! Aucun fichier .env.production.local / .env.local dans $APP_DIR/frontend"
              exit 1
            fi
            if ! grep -q '^NEXT_PUBLIC_RECAPTCHA_SITE_KEY=.\+' "$ENV_FILE"; then
              echo "!! NEXT_PUBLIC_RECAPTCHA_SITE_KEY absente ou vide dans $ENV_FILE"
              exit 1
            fi

            npm ci
            npm run build

            if pm2 describe "$PM2_NAME" > /dev/null 2>&1; then
              pm2 restart "$PM2_NAME"
            else
              pm2 start npm --name "$PM2_NAME" -- start -- -p 3000
              pm2 save
            fi
